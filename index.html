<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Space</title>
<link rel="icon" type="image/png" href="MOMO.png">
<link rel="apple-touch-icon" href="MOMO.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --stage:#f1f1f3;
  --panel:#ffffff;
  --field:#f6f6f8;
  --line:#ececef;
  --ink:#19191d;
  --ink-2:#55555e;
  --mute:#a3a3ad;
  --pink:#f0567a;
}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;background:var(--stage);color:var(--ink);font-size:14px;
  -webkit-font-smoothing:antialiased;letter-spacing:-.25px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ico{width:1em;height:1em;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}

/* ═══ layout ═══ */
.app{display:flex;height:100vh}
.panel{width:336px;flex:none;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line)}
.stage{flex:1;min-width:0;display:flex;flex-direction:column}

/* panel */
.p-top{padding:22px 22px 0}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;letter-spacing:-.6px;line-height:1}
.logo .mark{width:30px;height:30px;flex:none}
.logo span{font-weight:400;color:var(--mute)}
.tabs{display:flex;gap:18px;margin-top:24px;border-bottom:1px solid var(--line)}
.tabs button{position:relative;padding:0 0 12px;font-size:14px;font-weight:600;color:var(--mute);transition:color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink)}
.tabs button.on:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
.tabs sup{font-size:11px;font-weight:600;color:var(--mute);margin-left:3px;vertical-align:baseline}
.p-body{flex:1;overflow-y:auto;padding:22px 22px 32px;overscroll-behavior:contain}
.p-body::-webkit-scrollbar{width:0}

.blk{margin-bottom:30px}
.blk:last-child{margin-bottom:0}
.blk-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:20px}
.blk-h h4{font-size:12.5px;font-weight:600;color:var(--mute)}
.tl{font-size:12.5px;font-weight:500;color:var(--mute);transition:color .15s}
.tl:hover{color:var(--ink)}
.tl-row{display:flex;gap:14px}

.topics{display:flex;flex-wrap:wrap;gap:6px}
.topic{height:32px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);transition:.15s}
.topic:hover{border-color:#d6d6dc}
.topic.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

.field{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0;font-size:14px;
  padding:0 14px;height:44px;transition:border-color .15s}
.field:focus{border-color:var(--ink)}
.field::placeholder{color:var(--mute)}
textarea.field{height:auto;padding:12px 14px;line-height:1.65;resize:none;min-height:150px}
.field.title{font-size:15.5px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:8px}

.photo{display:flex;align-items:center;gap:10px;margin-top:8px;height:44px;padding:0 6px 0 14px;border-radius:12px;border:1px dashed #dadae0;
  cursor:pointer;font-size:13px;color:var(--ink-2);transition:border-color .15s}
.photo:hover{border-color:var(--ink)}
.photo .ico{font-size:16px;color:var(--mute)}
.photo .th{width:30px;height:30px;border-radius:7px;background:center/cover;flex:none}
.photo .grow{flex:1}
.photo .x{height:30px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--mute)}
.photo .x:hover{color:var(--pink)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;transition:border-color .15s}
.stat:focus-within{border-color:var(--ink)}
.stat label{font-size:12.5px;color:var(--mute);flex:none}
.stat input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.stat input::placeholder{color:#cfcfd6}

/* comments */
.cm{padding:16px 0;border-bottom:1px solid var(--line)}
.cm:first-child{padding-top:0}
.cm-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cm-av{width:18px;height:18px;border-radius:50%;flex:none}
.cm-name{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.who button{height:26px;padding:0 9px;font-size:11.5px;font-weight:500;color:var(--mute)}
.who button.on{background:var(--ink);color:#fff}
.mv{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mv button{width:26px;height:26px;display:grid;place-items:center;font-size:14px;color:var(--ink-2)}
.mv button+button{border-left:1px solid var(--line)}
.mv button:hover:not(:disabled){background:var(--field);color:var(--ink)}
.mv button:disabled{color:#d4d4da;cursor:default}
.cm-del{font-size:12px;color:var(--mute);padding:0 2px 0 6px}
.cm-del:hover{color:var(--pink)}
.cm textarea.field{min-height:46px;font-size:14px;padding:10px 12px}
.cm-meta{display:flex;gap:8px;margin-top:8px}
.cm-meta .stat{height:36px;padding:0 12px}
.cm-meta .stat:first-child{flex:1}
.cm-meta .stat:last-child{width:110px}
.cm-meta .stat input{font-size:13px}
.add{width:100%;height:44px;margin-top:16px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink);transition:.15s}
.add:hover{border-color:var(--ink)}
.blank{padding:8px 0 4px;color:var(--mute);font-size:13px;line-height:1.6}

/* style tab */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th-opt{border-radius:14px;padding:8px;border:1px solid var(--line);text-align:left;transition:.15s}
.th-opt.on{border-color:var(--ink)}
.th-opt .sw{height:58px;border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:6px}
.th-opt .sw i{display:block;height:5px;border-radius:3px;background:currentColor;opacity:.8}
.th-opt .sw i:nth-child(2){width:70%;opacity:.3}
.th-opt .sw i:nth-child(3){width:45%;opacity:.3}
.th-opt span{display:block;font-size:13px;font-weight:600;margin:9px 0 2px 4px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.hint{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-size:14px;font-weight:500}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch i{width:38px;height:22px;border-radius:999px;background:#dedee3;position:relative;flex:none;transition:.2s}
.switch i:after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--ink)}
.switch input:checked+i:after{left:19px}
.switch input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}

/* stage */
.s-bar{display:flex;justify-content:flex-end;gap:6px;padding:20px 24px 0}
.btn{height:38px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn .ico{font-size:15px}
.btn.soft{color:var(--ink-2)}
.btn.soft:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#000}
.s-view{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px 20px 56px}
.s-view::-webkit-scrollbar{width:0}
.holder{position:relative;flex:none;margin:auto 0}
.scaler{position:absolute;top:0;left:0;transform-origin:top left}

/* ═══ card (export target) ═══ */
.card{width:420px;background:var(--k-bg);color:var(--k-ink);border-radius:22px;overflow:hidden;
  box-shadow:0 24px 48px -28px rgba(0,0,0,.22);
  --k-bg:#fff;--k-ink:#19191d;--k-ink2:#4e4e57;--k-mute:#a3a3ad;--k-line:#f0f0f2;--k-soft:#f8f8f9}
.card.dark{--k-bg:#18181c;--k-ink:#f2f2f4;--k-ink2:#b8b8c0;--k-mute:#74747e;--k-line:#26262c;--k-soft:#1e1e23}
.k-in{padding:26px 26px 0}
.k-head{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.k-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none;
  background:color-mix(in srgb,var(--c) 18%,var(--k-bg));color:var(--c)}
.k-av .ico{font-size:20px;stroke:none}
.k-who{flex:1;min-width:0}
.k-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-meta{font-size:12.5px;color:var(--k-mute);margin-top:2px;white-space:nowrap}
.k-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--k-ink2);white-space:nowrap;flex:none}
.k-title{font-size:20px;font-weight:700;letter-spacing:-.6px;line-height:1.45;margin-bottom:10px;word-break:keep-all}
.k-text{font-size:15.5px;line-height:1.78;color:var(--k-ink2);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.k-text.ph{color:var(--k-mute)}
.k-img{width:100%;border-radius:14px;display:block;margin-top:18px}
.k-stats{display:flex;align-items:center;gap:16px;padding:18px 0 20px;margin-top:22px;border-top:1px solid var(--k-line);font-size:13px;font-weight:600;color:var(--k-ink2);font-variant-numeric:tabular-nums}
.k-stats span{display:inline-flex;align-items:center;gap:6px}
.k-stats .ico{font-size:16px}
.k-stats .lk{color:var(--pink)}
.k-cmts{border-top:1px solid var(--k-line);padding:4px 26px}
.k-c{display:flex;gap:11px;padding:16px 0}
.k-c+.k-c{border-top:1px solid var(--k-line)}
.k-cav{width:26px;height:26px;border-radius:50%;flex:none;background:color-mix(in srgb,var(--c) 22%,var(--k-bg))}
.k-cm{flex:1;min-width:0}
.k-cn{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.k-cn small{font-size:11px;font-weight:600;color:var(--k-mute)}
.k-ct{font-size:14.5px;line-height:1.6;margin-top:3px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.k-cf{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:12px;color:var(--k-mute)}
.k-cf b{display:inline-flex;align-items:center;gap:3px;color:var(--pink);font-weight:600}
.k-cf b .ico{font-size:11px}
.k-mark{display:flex;align-items:center;gap:6px;padding:14px 26px 18px;font-size:11.5px;font-weight:700;letter-spacing:-.3px;color:var(--k-mute);border-top:1px solid var(--k-line)}
.k-mark em{font-style:normal;font-weight:400}
.k-mark .mark{width:15px;height:15px;opacity:.55}
.card.dark .k-mark .mark{opacity:.8}

/* ooc */
.ooc{width:100%;min-height:400px;border:1px solid var(--line);border-radius:14px;background:var(--field);padding:16px;
  font-size:13px;line-height:1.75;resize:vertical;outline:0;transition:.15s}
.ooc:focus{border-color:var(--ink);background:#fff}
.ooc-acts{display:flex;gap:8px;margin-top:10px}
.ooc-acts .solid{flex:1;height:44px;border-radius:12px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px}
.ooc-acts .solid .ico{font-size:15px}
.ooc-acts .solid:hover{background:#000}
.ooc-acts .line{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink-2)}
.ooc-acts .line:hover{border-color:var(--ink);color:var(--ink)}
.ooc-steps{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--field);font-size:12.5px;color:var(--ink-2);line-height:1.7}
.ooc-steps b{color:var(--ink);font-weight:600}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:var(--ink);color:#fff;font-size:13px;font-weight:500;
  padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:100;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  html,body{height:auto}
  .app{flex-direction:column;height:auto}
  .stage{order:1}
  .panel{order:2;width:100%;border-right:0;border-top:1px solid var(--line)}
  .p-body{overflow:visible}
  .s-bar{position:sticky;top:0;z-index:5;padding:12px 16px;justify-content:space-between;align-items:center;
    background:rgba(241,241,243,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .s-bar .m-logo{display:block}
  .s-view{padding:12px 16px 32px}
  .p-top{padding:22px 20px 0}
  .p-top .logo{display:none}
  .tabs{margin-top:0}
  .p-body{padding:24px 20px 32px}
}
.m-logo{display:none;margin-right:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="p-top">
      <div class="logo"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#19191d"/><rect x="7" y="8" width="18" height="13" rx="6.5" fill="#fff"/><path d="M10.5 19.5v5.5l5-4z" fill="#fff"/><circle cx="13" cy="14.5" r="1.5" fill="#19191d"/><circle cx="19" cy="14.5" r="1.5" fill="#19191d"/><circle cx="25.5" cy="7" r="2.6" fill="#f0567a" stroke="#19191d" stroke-width="1.6"/></svg><div>Anonymous <span>Space</span></div></div>
      <nav class="tabs" id="tabs"></nav>
    </div>
    <div class="p-body" id="pbody"></div>
  </aside>

  <main class="stage">
    <div class="s-bar">
      <div class="logo m-logo"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#19191d"/><rect x="7" y="8" width="18" height="13" rx="6.5" fill="#fff"/><path d="M10.5 19.5v5.5l5-4z" fill="#fff"/><circle cx="13" cy="14.5" r="1.5" fill="#19191d"/><circle cx="19" cy="14.5" r="1.5" fill="#19191d"/><circle cx="25.5" cy="7" r="2.6" fill="#f0567a" stroke="#19191d" stroke-width="1.6"/></svg><div>Anonymous <span>Space</span></div></div>
      <button class="btn soft" data-act="copyImg"><span data-ico="copy"></span>복사</button>
      <button class="btn solid" data-act="saveImg"><span data-ico="download"></span>저장</button>
    </div>
    <div class="s-view" id="view">
      <div class="holder" id="holder"><div class="scaler" id="scaler"></div></div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ───────── icons ───────── */
const PATHS={
  image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>',
  bookmark:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  user:'<circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c0-4.1 3.4-6.5 7.5-6.5s7.5 2.4 7.5 6.5z"/>',
  up:'<path d="m6 15 6-6 6 6"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
};
const ic=(n,fill)=>`<svg class="ico${fill?' fill':''}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[n]||''}</svg>`;
document.querySelectorAll('[data-ico]').forEach(el=>el.outerHTML=ic(el.dataset.ico));

/* ───────── data ───────── */
const TOPICS=[
  {id:'daily', label:'일상',   color:'#e9a93a'},
  {id:'fluffy',label:'플러피', color:'#5bb2e6'},
  {id:'hot',   label:'핫이슈', color:'#e5605f'},
  {id:'worry', label:'고민',   color:'#9479e8'},
  {id:'love',  label:'연애',   color:'#ea6d9a'},
  {id:'work',  label:'직장',   color:'#3fae84'},
];
const C_COLORS=['#7c8cf0','#3fae84','#e9a93a','#9479e8','#5bb2e6','#e5805f','#ea6d9a','#8a9aa8'];
const TIMES=['방금 전','2분 전','8분 전','23분 전','47분 전','1시간 전','3시간 전','어제 21:14','어제 23:52'];
const STORE='anon-space-maker';
const MARK=`<svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#19191d"/><rect x="7" y="8" width="18" height="13" rx="6.5" fill="#fff"/><path d="M10.5 19.5v5.5l5-4z" fill="#fff"/><circle cx="13" cy="14.5" r="1.5" fill="#19191d"/><circle cx="19" cy="14.5" r="1.5" fill="#19191d"/><circle cx="25.5" cy="7" r="2.6" fill="#f0567a" stroke="#19191d" stroke-width="1.6"/></svg>`;
const OOC_DEFAULT=`*[OOC: 이전 RP 중지. 새로운 상황 전개. 직접적인 서술이 아닌, 익명 커뮤니티 형식으로, NPC/PC 두 사람 사이의 미묘한 분위기와 소문을 풀어낼 것. 함께 있는 모습, 사소한 스킨십, 일상 속 자연스러운 접점을 활용해 서술하되, 글쓴이는 어디까지나 목격담을 푸는 익명의 제3자처럼 현실감 있게 말해야 한다. 각 게시글은 실제 익명 커뮤니티에 올라온 짧은 목격담처럼, 한눈에 읽히는 분량으로 간결하게 작성한다. 두 사람의 관계를 직접 단정 짓기보다는, 사소한 배려·숨길 수 없는 애정·묘한 긴장감 등을 통해 주변 사람들이 눈치챌 정도의 분위기를 담아라. 전체적으로 설렘과 현실감이 느껴지도록, 익명 커뮤니티 감성을 살려 마무리하시오.
· 각 게시글 제목:
· 본문 내용:
· 댓글 반응:]*`;
const DEFAULT={topic:'daily',author:'',title:'',body:'',img:null,time:'방금 전',views:0,likes:0,saves:0,
  comments:[],dark:false,scale:2,mark:true,ooc:OOC_DEFAULT};
let S=JSON.parse(JSON.stringify(DEFAULT)), tab='post';

/* ───────── utils ───────── */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(+n||0).toLocaleString();
const dot=c=>`<span class="dot" style="background:${c}"></span>`;
const topicOf=id=>TOPICS.find(t=>t.id===id)||TOPICS[0];
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2000);}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S));}catch(e){try{localStorage.setItem(STORE,JSON.stringify({...S,img:null}));}catch(_){}}}
function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'null');if(d){S={...DEFAULT,...d};if(/\{\{char\}\}|이번 응답은 익명 커뮤니티 게시글 형식으로|같은 생활권\(학교·직장·동네 등\)[^]*\[게시글 1\]|NPC\/PC가 같은 대학에 다니는|같은 생활권\(학교·직장·동네 등\)|익명 커뮤니티에 올라온 게시글 형식으로 NPC와 PC/.test(String(S.ooc)))S.ooc=OOC_DEFAULT;}}catch(e){}}
// color-mix 를 못 쓰는 브라우저와 이미지 저장에서도 같은 색이 나오도록 JS 로 연한 색을 계산
function tint(hex,a){const bg=S.dark?[24,24,28]:[255,255,255],n=parseInt(hex.slice(1),16),c=[n>>16,(n>>8)&255,n&255];
  return `rgb(${c.map((v,i)=>Math.round(v*a+bg[i]*(1-a))).join(',')})`;}
function anonNo(i){let n=0;for(let j=0;j<=i;j++)if(!S.comments[j].au)n++;return n;}
// 익명 번호마다 색이 고정되도록 (자리를 옮겨도 '익명1'은 늘 같은 색), 글쓴이 색과는 겹치지 않게
function cColor(c,i){const tc=topicOf(S.topic).color;if(c.au)return tc;
  const pal=C_COLORS.filter(x=>x!==tc);return pal[(anonNo(i)-1)%pal.length];}
function cName(i){
  const c=S.comments[i];if(c.au)return S.author||'익명사용자';
  return `익명${anonNo(i)}`;
}

/* ───────── card ───────── */
function cardHTML(){
  const t=topicOf(S.topic);
  const cmts=S.comments.map((c,i)=>`
    <div class="k-c"><span class="k-cav" style="background:${tint(cColor(c,i),.22)}"></span>
      <div class="k-cm"><div class="k-cn">${esc(cName(i))}${c.au?'<small>글쓴이</small>':''}</div>
      <div class="k-ct">${esc(c.text)||'&nbsp;'}</div>
      <div class="k-cf"><span>${esc(c.time)}</span>${+c.likes>0?`<b>${ic('heart',true)}${num(c.likes)}</b>`:''}</div></div></div>`).join('');
  return `<div class="card ${S.dark?'dark':''}" id="card">
    <div class="k-in">
      <div class="k-head">
        <div class="k-av" style="color:${t.color};background:${tint(t.color,.18)}">${ic('user',true)}</div>
        <div class="k-who"><div class="k-name">${esc(S.author||'익명사용자')}</div>
          <div class="k-meta">${esc(S.time)} · 조회 ${num(S.views)}</div></div>
        <span class="k-tag">${dot(t.color)}${t.label}</span>
      </div>
      ${S.title?`<div class="k-title">${esc(S.title)}</div>`:''}
      <div class="k-text ${S.body?'':'ph'}">${S.body?esc(S.body):'본문을 쓰면 여기에 나타나요.'}</div>
      ${S.img?`<img class="k-img" src="${S.img}" alt="">`:''}
      <div class="k-stats">
        <span class="lk">${ic('heart',true)}${num(S.likes)}</span>
        <span>${ic('chat')}${S.comments.length}</span>
        <span>${ic('bookmark')}${num(S.saves)}</span>
      </div>
    </div>
    ${cmts?`<div class="k-cmts">${cmts}</div>`:''}
    ${S.mark?`<div class="k-mark">${MARK}<span>Anonymous <em>Space</em></span></div>`:''}
  </div>`;
}
let raf=0;
function paint(){$('#scaler').innerHTML=cardHTML();fit();save();}
const paintSoon=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint();});};
function fit(){
  const card=$('#card');if(!card)return;
  const w=card.offsetWidth,h=card.offsetHeight;
  const sc=Math.min(1,($('#view').clientWidth-32)/w);
  $('#scaler').style.transform=`scale(${sc})`;
  $('#holder').style.width=w*sc+'px';$('#holder').style.height=h*sc+'px';
}
addEventListener('resize',fit);

/* ───────── panel ───────── */
const TABS=[['post','글'],['cmt','댓글'],['look','꾸미기'],['ooc','OOC']];
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="tab" data-v="${k}">${l}${k==='cmt'&&S.comments.length?`<sup>${S.comments.length}</sup>`:''}</button>`).join('');
}
function V_post(){
  const has=!!S.img;
  return `
  <div class="blk">
    <div class="blk-h"><h4>주제</h4></div>
    <div class="topics">${TOPICS.map(t=>`<button class="topic ${S.topic===t.id?'on':''}" data-act="topic" data-v="${t.id}">${dot(t.color)}${t.label}</button>`).join('')}</div>
  </div>
  <div class="blk">
    <div class="blk-h"><h4>내용</h4><button class="tl" data-act="clearPost">비우기</button></div>
    <div class="stack">
      <input class="field" data-k="author" value="${esc(S.author)}" placeholder="작성자" maxlength="20" aria-label="작성자">
      <input class="field title" data-k="title" value="${esc(S.title)}" placeholder="제목" maxlength="80" aria-label="제목">
      <textarea class="field" data-k="body" placeholder="오늘 어떤 일이 있었나요?" aria-label="본문">${esc(S.body)}</textarea>
    </div>
    <label class="photo">
      ${has?`<span class="th" style="background-image:url('${S.img}')"></span>`:ic('image')}
      <span class="grow">${has?'사진 바꾸기':'사진 추가'}</span>
      ${has?`<button class="x" data-act="delImg">빼기</button>`:''}
      <input type="file" id="file" accept="image/*" hidden>
    </label>
  </div>
  <div class="blk">
    <div class="blk-h"><h4>반응</h4><button class="tl" data-act="roll">랜덤</button></div>
    <div class="stats">
      <div class="stat"><label for="st">시간</label><input id="st" data-k="time" value="${esc(S.time)}" placeholder="방금 전"></div>
      <div class="stat"><label for="sv">조회</label><input id="sv" data-k="views" data-num value="${S.views||''}" placeholder="0" inputmode="numeric"></div>
      <div class="stat"><label for="sl">좋아요</label><input id="sl" data-k="likes" data-num value="${S.likes||''}" placeholder="0" inputmode="numeric"></div>
      <div class="stat"><label for="ss">북마크</label><input id="ss" data-k="saves" data-num value="${S.saves||''}" placeholder="0" inputmode="numeric"></div>
    </div>
  </div>`;
}
function V_cmt(){
  const list=S.comments.map((c,i)=>`
    <div class="cm">
      <div class="cm-top">
        <span class="cm-av" style="background:${cColor(c,i)}"></span>
        <span class="cm-name">${esc(cName(i))}</span>
        <div class="who"><button class="${c.au?'':'on'}" data-act="who" data-i="${i}" data-v="0">익명</button><button class="${c.au?'on':''}" data-act="who" data-i="${i}" data-v="1">글쓴이</button></div>
        <span class="mv">
          <button data-act="moveC" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="위로 옮기기">${ic('up')}</button>
          <button data-act="moveC" data-i="${i}" data-d="1" ${i===S.comments.length-1?'disabled':''} aria-label="아래로 옮기기">${ic('down')}</button>
        </span>
        <button class="cm-del" data-act="delC" data-i="${i}">삭제</button>
      </div>
      <textarea class="field" data-c="${i}" data-f="text" rows="1" placeholder="댓글 내용" aria-label="댓글 내용">${esc(c.text)}</textarea>
      <div class="cm-meta">
        <div class="stat"><label>시간</label><input data-c="${i}" data-f="time" value="${esc(c.time)}" placeholder="방금 전"></div>
        <div class="stat"><label>좋아요</label><input data-c="${i}" data-f="likes" data-num value="${c.likes||''}" placeholder="0" inputmode="numeric"></div>
      </div>
    </div>`).join('');
  return `
  ${S.comments.length?`<div class="blk-h"><h4>댓글 ${S.comments.length}개</h4><span class="tl-row"><button class="tl" data-act="rollC">시간·좋아요 랜덤</button><button class="tl" data-act="clearC">모두 삭제</button></span></div>`:''}
  <div>${list||`<div class="blank">아직 댓글이 없어요.</div>`}</div>
  <button class="add" data-act="addC">+ 댓글 추가</button>`;
}
function V_look(){
  return `
  <div class="blk">
    <div class="blk-h"><h4>카드 색</h4></div>
    <div class="themes">
      <button class="th-opt ${S.dark?'':'on'}" data-act="theme" data-v="0"><div class="sw" style="background:#f4f4f6;color:#19191d"><i></i><i></i><i></i></div><span>라이트</span></button>
      <button class="th-opt ${S.dark?'on':''}" data-act="theme" data-v="1"><div class="sw" style="background:#18181c;color:#f2f2f4"><i></i><i></i><i></i></div><span>다크</span></button>
    </div>
  </div>
  <div class="blk">
    <div class="blk-h"><h4>저장 화질</h4></div>
    <div class="seg">${[[1,'보통'],[2,'선명'],[3,'아주 선명']].map(([v,l])=>`<button class="${S.scale===v?'on':''}" data-act="scale" data-v="${v}">${l}</button>`).join('')}</div>
    <p class="hint">선명할수록 파일이 커져요. 보통은 '선명'이면 충분해요.</p>
  </div>
  <div class="blk">
    <label class="switch">카드 아래 로고 넣기<input type="checkbox" data-k="mark" ${S.mark?'checked':''}><i></i></label>
  </div>`;
}
function V_ooc(){
  return `
  <div class="blk-h"><h4>RP 대화창에 붙여넣을 프롬프트</h4></div>
  <textarea class="ooc" data-k="ooc" spellcheck="false" aria-label="OOC 프롬프트">${esc(S.ooc)}</textarea>
  <div class="ooc-acts">
    <button class="solid" data-act="copyOoc">${ic('copy')}프롬프트 복사</button>
    <button class="line" data-act="resetOoc">기본값으로</button>
  </div>
  <div class="ooc-steps"><b>쓰는 법</b><br>프롬프트를 복사해 RP 대화창에 보내면 게시글이 여러 개 나와요. 마음에 드는 글을 골라 제목·본문은 글 탭에, 댓글은 댓글 탭에 옮겨 적으면 돼요. 내용은 자유롭게 고쳐 쓸 수 있어요.</div>`;
}
function renderPanel(keepScroll){
  const b=$('#pbody'),y=b.scrollTop;
  renderTabs();
  b.innerHTML=({post:V_post,cmt:V_cmt,look:V_look,ooc:V_ooc})[tab]();
  if(keepScroll)b.scrollTop=y;
  const f=$('#file');if(f)f.onchange=onFile;
  b.querySelectorAll('textarea:not(.ooc)').forEach(grow);
}
function grow(t){const min=t.closest('.cm')?46:150;t.style.height='auto';t.style.height=Math.max(min,t.scrollHeight+2)+'px';}

/* ───────── events ───────── */
document.addEventListener('input',e=>{
  const el=e.target;
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.num!==undefined){v=v.replace(/\D/g,'').slice(0,7);el.value=v;v=+v||0;}
  if(el.dataset.k){S[el.dataset.k]=v;}
  else if(el.dataset.c!==undefined){S.comments[+el.dataset.c][el.dataset.f]=v;}
  else return;
  if(el.tagName==='TEXTAREA'&&!el.classList.contains('ooc'))grow(el);
  if(el.dataset.k==='ooc'){save();return;}
  paintSoon();
});
const A={
  tab:el=>{tab=el.dataset.v;renderPanel();$('#pbody').scrollTop=0;},
  topic:el=>{S.topic=el.dataset.v;renderPanel(true);paint();},
  theme:el=>{S.dark=el.dataset.v==='1';renderPanel(true);paint();},
  scale:el=>{S.scale=+el.dataset.v;renderPanel(true);save();},
  delImg:()=>{S.img=null;renderPanel(true);paint();},
  roll:()=>{S.time=pick(TIMES);S.views=rnd(80,3000);S.likes=rnd(3,240);S.saves=rnd(0,40);
    renderPanel(true);paint();toast('반응 수치를 랜덤으로 채웠어요');},
  clearPost:()=>{if(!confirm('제목, 본문, 사진을 비울까요?'))return;S.title='';S.body='';S.img=null;renderPanel(true);paint();},
  rollC:()=>{
    // 위 댓글일수록 먼저 달린 것처럼 시간을 오래된 순으로 맞춘다
    const idx=S.comments.map(()=>rnd(0,TIMES.length-1)).sort((a,b)=>b-a);
    S.comments.forEach((c,i)=>{c.time=TIMES[idx[i]];c.likes=Math.random()>.35?rnd(1,40):0;});
    renderPanel(true);paint();toast('댓글 시간과 좋아요를 랜덤으로 채웠어요');},
  moveC:el=>{
    const i=+el.dataset.i,j=i+(+el.dataset.d),C=S.comments;
    if(j<0||j>=C.length)return;
    [C[i],C[j]]=[C[j],C[i]];
    renderPanel(true);paint();
    document.querySelectorAll('.cm')[j]?.scrollIntoView({block:'nearest',behavior:'smooth'});},
  who:el=>{S.comments[+el.dataset.i].au=el.dataset.v==='1';renderPanel(true);paint();},
  addC:()=>{S.comments.push({text:'',time:'방금 전',likes:0,au:false});renderPanel(true);paint();
    const all=document.querySelectorAll('.cm');const last=all[all.length-1];
    last?.scrollIntoView({block:'center',behavior:'smooth'});last?.querySelector('textarea')?.focus({preventScroll:true});},
  delC:el=>{S.comments.splice(+el.dataset.i,1);renderPanel(true);paint();},
  clearC:()=>{if(!confirm('댓글을 모두 지울까요?'))return;S.comments=[];renderPanel(true);paint();},
  copyOoc:async()=>{
    try{await navigator.clipboard.writeText(S.ooc);}
    catch(e){const t=$('.ooc');t.select();document.execCommand('copy');}
    toast('프롬프트를 복사했어요');},
  resetOoc:()=>{if(S.ooc!==OOC_DEFAULT&&!confirm('고친 내용을 지우고 기본값으로 되돌릴까요?'))return;S.ooc=OOC_DEFAULT;renderPanel(true);save();toast('기본값으로 되돌렸어요');},
  saveImg:()=>exportImg(false),
  copyImg:()=>exportImg(true),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();A[el.dataset.act]?.(el);});
function onFile(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!/^image\//.test(f.type))return toast('이미지 파일만 넣을 수 있어요');
  const r=new FileReader();
  r.onerror=()=>toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요');
  r.onload=ev=>{
    const src=ev.target.result,im=new Image();
    im.onerror=()=>toast('사진을 읽지 못했어요. 다른 사진으로 시도해 주세요');
    im.onload=()=>{
      // 큰 사진은 줄여서 넣는다 — 저장 공간 초과와 이미지 저장 실패를 막기 위해
      const max=1200,sc=Math.min(1,max/Math.max(im.width,im.height));
      if(sc===1&&f.size<1.5e6){S.img=src;}
      else{
        const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        S.img=c.toDataURL('image/jpeg',.9);
      }
      renderPanel(true);paint();
    };
    im.src=src;
  };
  r.readAsDataURL(f);
}

/* ───────── export ───────── */
let busy=false;
async function renderBlob(){
  try{await document.fonts.ready;}catch(e){}
  const node=$('#card');
  await Promise.all([...node.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
  const w=node.offsetWidth,h=node.offsetHeight;
  // 모바일 사파리는 캔버스 크기 제한이 있어 너무 크면 빈 이미지가 나온다
  let r=S.scale;while(r>1&&w*h*r*r>16e6)r--;
  const opt={pixelRatio:r,width:w,height:h,style:{transform:'none',boxShadow:'none'}};
  await htmlToImage.toBlob(node,opt); // 첫 렌더에서 글꼴이 빠지는 문제 방지
  const blob=await htmlToImage.toBlob(node,opt);
  if(!blob)throw new Error('empty');
  return blob;
}
async function exportImg(copy){
  if(busy)return;
  if(typeof htmlToImage==='undefined')
    return toast('이미지 저장 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요');
  if(copy&&(!window.ClipboardItem||!navigator.clipboard?.write))
    return toast('이 브라우저는 이미지 복사를 지원하지 않아요. 저장을 써 주세요');
  busy=true;
  toast(copy?'이미지를 복사하는 중…':'이미지를 저장하는 중…');
  try{
    if(copy){
      const job=renderBlob();
      try{
        // 사파리는 클릭 직후에 바로 클립보드를 요청해야 해서 Promise 를 그대로 넘긴다
        await navigator.clipboard.write([new ClipboardItem({'image/png':job})]);
      }catch(e){
        const blob=await job;
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      }
      toast('이미지를 복사했어요');
    }else{
      const blob=await renderBlob(),url=URL.createObjectURL(blob);
      const d=new Date(),z=n=>String(n).padStart(2,'0');
      const a=document.createElement('a');a.href=url;
      a.download=`anonymous_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.png`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      toast('이미지를 저장했어요');
    }
  }catch(err){console.error(err);toast(copy?'복사하지 못했어요. 저장을 써 주세요':'저장하지 못했어요. 다시 시도해 주세요');}
  finally{busy=false;}
}

load();renderPanel();paint();
if(document.fonts)document.fonts.ready.then(fit);
</script>
